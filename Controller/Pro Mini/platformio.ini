; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:pro8MHzatmega328]
platform = atmelavr
board = pro8MHzatmega328
framework = arduino
upload_port = /dev/cu.usbserial-A403JHXL
upload_flags = -V
monitor_port = /dev/cu.usbserial-A403JHXL
monitor_speed = 38400
lib_deps =
    olikraus/U8g2@^2.34.17
    paulstoffregen/AltSoftSerial@^1.4
build_src_filter = +<*> -<display_test.cpp>

; Stand-alone display test: builds only src/display_test.cpp (no modem, encoder or sleep).
; Select this environment in PlatformIO, or: pio run -e display_test -t upload
[env:display_test]
extends = env:pro8MHzatmega328
build_src_filter = -<*> +<display_test.cpp>
